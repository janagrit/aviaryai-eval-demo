<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Union Voice Agent</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1b1f24;
      --muted: #5b6573;
      --border: #d6dbe1;
      --caller: #e8eefc;
      --agent: #eef6ee;
      --accent: #2f5bd3;
      --error: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --panel: #1a1f25;
        --text: #e6e9ed;
        --muted: #9aa4b1;
        --border: #2d343c;
        --caller: #1f2a44;
        --agent: #1d2e22;
        --accent: #7aa2ff;
        --error: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.25rem; margin: 0; }
    select, input, button {
      font: inherit;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }
    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #transcript {
      list-style: none;
      margin: 0 0 16px;
      padding: 16px;
      min-height: 240px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #transcript:empty::before {
      content: "Type what the caller says to start a call.";
      color: var(--muted);
    }
    .turn { padding: 8px 12px; border-radius: 10px; overflow-wrap: anywhere; }
    .turn .who { display: block; font-size: 0.8rem; color: var(--muted); }
    .caller { background: var(--caller); align-self: flex-end; }
    .agent { background: var(--agent); align-self: flex-start; }
    form { display: flex; gap: 8px; }
    form input { flex: 1; min-width: 0; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    #error { color: var(--error); min-height: 1.5em; margin: 8px 0 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Credit Union Voice Agent</h1>
      <label>Agent
        <select id="mode">
          <option value="strict">Strict</option>
          <option value="lax">Lax</option>
        </select>
      </label>
    </header>

    <ol id="transcript" role="log" aria-label="Conversation" aria-live="polite"></ol>

    <form id="caller-form">
      <label for="message" class="sr-only">Caller says</label>
      <input id="message" maxlength="1000" autocomplete="off"
             placeholder="Type what the caller says…">
      <button type="submit" disabled>Send</button>
    </form>
    <p id="error" role="alert"></p>
  </main>

  <script>
    const form = document.getElementById("caller-form");
    const input = document.getElementById("message");
    const button = form.querySelector("button");
    const mode = document.getElementById("mode");
    const transcript = document.getElementById("transcript");
    const errorBox = document.getElementById("error");

    function addTurn(kind, who, text) {
      const item = document.createElement("li");
      item.className = "turn " + kind;
      item.dataset.testid = kind + "-turn";
      const label = document.createElement("span");
      label.className = "who";
      label.textContent = who;
      const body = document.createElement("span");
      body.className = "text";
      body.textContent = text; // never innerHTML: replies and input are untrusted
      item.append(label, body);
      transcript.append(item);
    }

    function updateButton() {
      button.disabled = input.value.trim() === "";
    }

    input.addEventListener("input", updateButton);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value;
      if (!message.trim()) return;
      errorBox.textContent = "";
      addTurn("caller", "Caller", message);
      input.value = "";
      updateButton();
      button.disabled = true;
      try {
        const response = await fetch("/api/respond", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode: mode.value, message }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        addTurn("agent", data.agent, data.reply);
      } catch (err) {
        errorBox.textContent = "Couldn't reach the agent: " + err.message;
      } finally {
        updateButton();
      }
    });
  </script>
</body>
</html>
